name: Build Complete 3DS Project

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Compile Homebrew
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
      # Force root user permissions inside the container to prevent apt/pacman permission locks
      options: --user root

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Environment Variables
        run: |
          # Lock system paths before anything executes to avoid path lookups returning exit code 2
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> $GITHUB_ENV
          echo "/opt/devkitpro/tools/bin" >> $GITHUB_PATH
          echo "/opt/devkitpro/devkitARM/bin" >> $GITHUB_PATH

      - name: Safely Install Linux Host Utilities
        run: |
          # Adding '--allow-releaseinfo-change' stops apt from crashing if Debian repository dates mismatches
          apt-get update --allow-releaseinfo-change || true
          apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git python3 python3-pip zip unzip || true

      - name: Update Pacman & Install 3DS Components
        run: |
          # Force sync database files cleanly without strict package locking
          dkp-pacman -Syy --noconfirm
          dkp-pacman -S --needed --noconfirm \
            3ds-dev \
            libctru \
            citro3d \
            citro2d \
            picasso

      - name: Build Project via Make
        run: |
          # Clear old compilation loops safely
          make clean || true
          
          # Run compilation. If it fails, it prints why rather than hiding behind code 2.
          make -j$(nproc)

      - name: Archive and Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-build-package
          path: |
            **/*.3dsx
            **/*.elf
            **/*.cia
          if-no-files-found: warn
