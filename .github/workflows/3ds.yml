name: Build Complete 3DS Project

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Compile Homebrew
    runs-on: ubuntu-latest
    # Using official devkitPro image built on debian-slim
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4
        with:
          submodules: recursive # Automatically pulls engine dependencies

      - name: Install Host Linux Build Tools
        run: |
          # The Docker image is highly stripped down. Fixes exit code 1 caused by missing native tools.
          apt-get update && apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            git \
            python3 \
            zip \
            unzip

      - name: Update Pacman & Install Every 3DS Library
        run: |
          # Sync devkitPro repositories and install all core, 3D graphics, audio, and asset tools
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --needed --noconfirm \
            3ds-dev \
            libctru \
            citro3d \
            citro2d \
            picasso \
            3ds-libjpeg-turbo \
            3ds-bzip2 \
            3ds-curl

      - name: Set DevkitPro Environment & Build
        run: |
          # Lock in absolute directory flags so the Makefile never fails discovery
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH
          
          # Clean execution loop to avoid asset locking errors
          make clean || true
          make -j$(nproc)

      - name: Archive and Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-build-package
          # '**/' searches recursively to find files if your engine places them inside /build or /bin
          path: |
            **/*.3dsx
            **/*.elf
            **/*.cia
          if-no-files-found: error # Explicitly tells you if the make step built nothing
